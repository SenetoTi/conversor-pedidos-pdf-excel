<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Conversor de Pedidos{% endblock %} - {{ NOME_SISTEMA }}</title>
<style>
:root{--azul:#0F766E;--azul2:#0F766E;--azul-h:#0B5F58;--gelo:#E3F4F1;--fundo:#F4F6F8;--borda:#DCE1E8;--texto:#1A2230;--sec:#55606F;--tinta:#172033;--ok-f:#E2EFDA;--ok-t:#375623;--er-f:#FFC7CE;--er-t:#9C0006;--av-f:#FFF2CC;--av-t:#7F6000}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background:var(--fundo);color:var(--texto);line-height:1.5;font-variant-numeric:tabular-nums}
h1{font-size:1.6rem;font-weight:600;margin:0 0 1rem}h2{font-size:1.15rem;font-weight:600;margin:1.5rem 0 .6rem}a{color:var(--azul2)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--azul2);outline-offset:2px}
.pular{position:absolute;left:-999px;top:0;background:#fff;padding:.5rem 1rem;z-index:10}.pular:focus{left:.5rem;top:.5rem}
/* menu lateral retrátil, igual ao do Escala e do Conciliador; o Conversor é verde-água */
.app{display:flex;min-height:100vh}
.lateral{flex:0 0 232px;width:232px;background:var(--tinta);color:#fff;padding:16px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.lateral .topo-menu{display:flex;align-items:center;gap:8px;padding:4px 4px 16px}
.lateral .marca{display:inline-flex;align-items:center;gap:10px;flex:1;min-width:0;color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.lateral .icone{border-radius:7px;flex:none}
.lateral button.recolher{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;width:36px;min-height:36px;padding:0;font-size:16px}
.lateral button.recolher:hover{background:rgba(255,255,255,.1)}
.lateral a.item{display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 12px;border-radius:6px;color:#C9D2E0;text-decoration:none}
.lateral a.item:hover{background:rgba(255,255,255,.07);color:#fff}
.lateral a.item[aria-current=page]{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.lateral a.item.app-ativo{box-shadow:inset 3px 0 0 #2DD4BF;background:rgba(255,255,255,.08);color:#fff;font-weight:600}
.lateral .ponto{width:10px;height:10px;border-radius:3px;flex:none}
.lateral .grupo{font-size:12px;font-weight:600;color:#9AA6BA;padding:16px 12px 4px}
.lateral .rodape{margin-top:auto;padding:16px 12px 0;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#9AA6BA;overflow-wrap:anywhere}
.lateral :focus-visible{outline:3px solid #99F6E4;outline-offset:2px}
.corpo{flex:1 1 0;min-width:0;padding:24px 32px;max-width:80rem}
@media(min-width:901px){
.app.recolhido .lateral{flex-basis:64px;width:64px;padding:16px 8px;align-items:center}
.app.recolhido .lateral .topo-menu{flex-direction:column;padding:0 0 8px}
.app.recolhido .lateral .marca span,.app.recolhido .lateral .rotulo,.app.recolhido .lateral .grupo,.app.recolhido .lateral .rodape,.app.recolhido .lateral .so-aberto-nav{display:none}
.app.recolhido .lateral a.item{width:44px;justify-content:center;padding:0}}
@media(max-width:900px){
.app{display:block}
.lateral,.app.recolhido .lateral{position:static;width:auto;height:auto;flex-direction:row;align-items:center;overflow-x:auto;gap:4px;padding:8px 12px}
.lateral .topo-menu{padding:0 8px 0 0}.lateral .recolher,.lateral .grupo,.lateral .rodape{display:none}
.lateral a.item{white-space:nowrap;min-height:44px}.lateral nav{display:flex;gap:4px;align-items:center}.lateral .marca span{display:none}.lateral .marca{flex:none}
.corpo{padding:16px}}
/* conteúdo */
.btn,main a.btn{display:inline-flex;align-items:center;min-height:44px;padding:.4rem 1rem;border:1px solid var(--azul);border-radius:6px;background:#fff;color:var(--azul);text-decoration:none;font-size:.95rem}
.btn:hover{background:var(--gelo)}.btn[aria-current=page]{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:600}
button{min-height:44px;padding:.4rem 1rem;background:var(--azul);color:#fff;border:0;border-radius:6px;cursor:pointer;font:inherit}button:hover{background:var(--azul-h)}button:disabled{background:#9aa6b4;cursor:not-allowed}
button.principal{background:var(--azul);font-weight:600}button.principal:hover{background:var(--azul-h)}
button.sec{background:#fff;color:var(--azul);border:1px solid var(--azul)}button.sec:hover{background:var(--gelo)}
.btn.destaque,main a.btn.destaque{background:var(--azul);color:#fff;font-weight:600}.btn.destaque:hover{background:var(--azul-h)}
.abas{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0 1rem}
.cartao{background:#fff;border:1px solid var(--borda);border-radius:8px;padding:1rem 1.2rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(27,36,48,.1)}
label{display:block;margin:.7rem 0;font-weight:500}input[type=text]{width:100%;padding:.5rem;min-height:44px;border:1px solid #8a94a3;border-radius:6px;background:#fff;font:inherit}
input[type=file]{width:100%;padding:.5rem;border:1px solid #8a94a3;border-radius:6px;background:#fff;font:inherit}
label.marcar{display:flex;gap:.5rem;align-items:center;font-weight:400}label.marcar input{width:auto;min-height:0}
.guia{color:var(--sec);max-width:60rem}
.aviso{padding:.7rem 1rem;border-radius:6px;margin:.7rem 0}.aviso.ok{background:var(--ok-f);color:var(--ok-t)}.aviso.ok::before{content:"✓ ";font-weight:700}
.aviso.erro{background:var(--er-f);color:var(--er-t)}.aviso.erro::before{content:"✕ ";font-weight:700}
.aviso.atencao{background:var(--av-f);color:var(--av-t)}.aviso.atencao::before{content:"! ";font-weight:700}
.soltar{display:block;border:2px dashed var(--azul);border-radius:8px;padding:1.4rem;text-align:center;background:#fff;margin:.7rem 0;font-weight:400;cursor:pointer}
.soltar.sobre{background:var(--gelo)}.soltar strong{display:block;font-size:1.05rem}.soltar .arq{display:block;margin-top:.4rem;color:var(--sec);overflow-wrap:anywhere}
.soltar.tem .arq{color:var(--ok-t);font-weight:600}.soltar input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.soltar:focus-within{outline:3px solid var(--azul2);outline-offset:2px}
.passos{display:flex;gap:.6rem;flex-wrap:wrap;margin:.4rem 0 1rem}.passo{padding:.3rem .8rem;border-radius:99px;background:#EDEFF2;color:#55606F;font-size:.9rem}
.passo.feito{background:var(--ok-f);color:var(--ok-t)}.passo.feito::before{content:"✓ "}.passo.agora{background:var(--av-f);color:var(--av-t);font-weight:600}.passo.agora::before{content:"… "}.passo.falhou{background:var(--er-f);color:var(--er-t);font-weight:600}.passo.falhou::before{content:"✕ "}
table{border-collapse:collapse;width:100%;background:#fff}th{background:var(--gelo);color:var(--azul);text-align:left;font-size:.85rem}td,th{border-bottom:1px solid var(--borda);padding:.45rem .6rem}td.n,th.n{text-align:right}
.rolagem{overflow:auto;background:#fff;border:1px solid var(--borda);border-radius:8px}
pre.log{background:#fff;border:1px solid var(--borda);border-radius:6px;padding:.6rem;max-height:20rem;overflow:auto;font-size:.8rem;white-space:pre-wrap}
details summary{cursor:pointer;color:var(--azul);font-weight:600;min-height:32px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<script>
(function(){var app=document.getElementById("app"),btn=document.getElementById("btn_menu");
function aplicar(r){app.classList.toggle("recolhido",r);btn.textContent=r?"»":"«";btn.setAttribute("aria-expanded",r?"false":"true");btn.setAttribute("aria-label",r?"Expandir menu":"Recolher menu");btn.title=r?"Expandir menu":"Recolher menu"}
var r=false;try{r=localStorage.getItem("menu_recolhido")==="1"}catch(e){}aplicar(r);
btn.addEventListener("click",function(){r=!r;aplicar(r);try{localStorage.setItem("menu_recolhido",r?"1":"0")}catch(e){}});
/* confirmação antes de ações que trocam dados: qualquer form com data-confirma */
document.addEventListener("submit",function(e){var m=e.target.getAttribute&&e.target.getAttribute("data-confirma");if(m&&!window.confirm(m))e.preventDefault()});
/* zona de soltar arquivo: o campo de arquivo continua funcionando sem JavaScript */
[].forEach.call(document.querySelectorAll(".soltar"),function(z){var inp=z.querySelector("input[type=file]"),arq=z.querySelector(".arq");
var bt=z.form&&z.form.querySelector("button[type=submit]");
function nome(){arq.textContent=inp.files.length?inp.files[0].name:"Nenhum arquivo escolhido";z.classList.toggle("tem",!!inp.files.length);if(bt)bt.disabled=!inp.files.length}
inp.addEventListener("change",nome);
["dragenter","dragover"].forEach(function(ev){z.addEventListener(ev,function(e){e.preventDefault();z.classList.add("sobre")})});
["dragleave","drop"].forEach(function(ev){z.addEventListener(ev,function(e){e.preventDefault();z.classList.remove("sobre")})});
z.addEventListener("drop",function(e){if(e.dataTransfer.files.length){inp.files=e.dataTransfer.files;nome()}});nome()})
})();
</script>
